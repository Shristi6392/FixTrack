services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fixtrack
      POSTGRES_PASSWORD: fixtrack
      POSTGRES_DB: fixtrack
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixtrack"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
